app-id: np.com.safallama.typeshi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: typeshi
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-pictures:ro
modules:
  - name: typeshi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFLATPAK_BUILD=ON
    sources:
      - type: git
        url: https://git.safallama.com.np/safalski/typeShi.git
        tag: v0.1.4
