name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-svg

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja
          ninja -C build

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DESTDIR="$PWD/staging" ninja -C build install/strip
          tar czf "typeshi-bin-$VER-x86_64.tar.gz" -C staging usr
          sha256sum "typeshi-bin-$VER-x86_64.tar.gz" > "typeshi-bin-$VER-x86_64.tar.gz.sha256"
          ls -la typeshi-bin-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            typeshi-bin-*-x86_64.tar.gz
            typeshi-bin-*-x86_64.tar.gz.sha256
